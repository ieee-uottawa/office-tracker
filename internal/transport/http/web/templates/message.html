{{define "content"}}
<section class="relative w-full py-12 md:py-16">
  <div class="container">
    <div class="max-w-2xl space-y-6">
      <h1 class="page-title">{{.Heading}}</h1>
      <p class="page-intro">{{.Message}}</p>
      {{if .ActionURL}}<a href="{{.ActionURL}}" class="btn btn-default">{{.Action}}</a>{{end}}
    </div>
  </div>
</section>
{{end}}
