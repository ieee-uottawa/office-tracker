{{define "content"}}
<section class="relative w-full pb-6 pt-12 md:pt-16">
  <div class="container">
    <header class="space-y-4">
      <h1 class="page-title">Office booking</h1>
      <p class="page-intro">Book the IEEE uOttawa office. A Signing Officer approves each request.</p>
    </header>
  </div>
</section>

<section class="relative w-full pb-12 md:pb-16">
  <div class="container">
    <header class="mb-6 flex flex-wrap items-end justify-between gap-4 border-b border-border pb-4">
      <h2 class="font-display text-2xl font-medium tabular-nums md:text-3xl" data-range>&nbsp;</h2>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" class="btn btn-outline btn-sm" data-today>Today</button>
        <button type="button" class="btn btn-icon text-primary hover:bg-card" data-prev aria-label="Previous">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="btn btn-icon text-primary hover:bg-card" data-next aria-label="Next">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="btn-group inline-flex" role="group" aria-label="View">
          <button type="button" class="btn btn-outline btn-sm" data-view="day">Day</button>
          <button type="button" class="btn btn-outline btn-sm" data-view="week">Week</button>
          <button type="button" class="btn btn-outline btn-sm" data-view="month">Month</button>
        </div>
        <button type="button" class="btn btn-outline btn-sm hidden md:inline-flex" data-subscribe>Google Calendar</button>
        {{if .User.Book}}<button type="button" class="btn btn-default btn-sm" data-book>Book office time</button>{{end}}
      </div>
    </header>
    <div data-calendar aria-live="polite"></div>
  </div>
</section>

<div data-scrim class="fixed inset-0 z-40 hidden bg-foreground/20"></div>
<aside data-panel role="dialog" aria-modal="false" aria-labelledby="panel-title"
  class="fixed inset-x-0 bottom-0 z-50 flex max-h-[88vh] translate-y-full flex-col border-t border-border bg-background transition-transform duration-200 md:inset-x-auto md:inset-y-0 md:right-0 md:max-h-none md:w-[28rem] md:translate-x-full md:translate-y-0 md:border-l md:border-t-0"></aside>
{{end}}
